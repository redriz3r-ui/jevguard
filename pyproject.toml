[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevguard"
version = "0.1.0"
description = "Sandboxed runtime guard research prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jevguard = "jevguard.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
